[package]
name = "xgboost_lib-sys"
version = "3.4.0"
authors = ["Dave Challis <dave@suicas.net>", "Marco Mengelkoch"]
links = "xgboost"
build = "build.rs"
license = "MIT"
repository = "https://github.com/marcomq/rust-xgboost"
description = "Native bindings to the xgboost library"
readme = "README.md"
edition = "2021"
exclude = [
    "lib/*",
]

[lib]
# The bindings carry XGBoost's C doc comments, whose indented blocks are not Rust examples.
doctest = false

[dependencies]
libc = "0.2"
libloading = { version = "0.8", optional = true }

[build-dependencies]
bindgen = { version = "0.71" }
dunce =  { version = "1.0.5" }
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
cmake = { version = "0.1", optional = true }
syn = { version = "2", features = ["full"], optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }

[features]
default = ["use_prebuilt_xgb"]
use_prebuilt_xgb = ["ureq", "sha2"]
local_build = ["cmake"]
cuda = []
# Load the library with dlopen on first use instead of linking it: binaries start without it.
runtime_load = ["libloading", "syn", "quote", "proc-macro2"]
