name: Linux

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    # The download path links the published release assets, whose loader
    # names (install name / SONAME) only a real run exercises.
    - name: Run tests (prebuilt libraries)
      run: cargo test --verbose --no-default-features --features use_prebuilt_xgb
