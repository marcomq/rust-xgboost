name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish xgboost_lib-sys, then xgb
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          sys_version=$(cargo metadata --manifest-path xgboost-sys/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sf -A "rust-xgboost release workflow" "https://crates.io/api/v1/crates/xgboost_lib-sys/$sys_version" > /dev/null; then
            echo "xgboost_lib-sys $sys_version is already on crates.io, skipping"
          else
            # cargo publish waits until the new version is in the index
            cargo publish --manifest-path xgboost-sys/Cargo.toml
          fi
          cargo publish -p xgb
